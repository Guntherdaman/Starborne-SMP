name: Starborne
version: 1.0.0
main: com.starborne.Starborne
api-version: '1.21.11'
author: Guntherdaman
description: The Starborne SMP custom survival plugin.

commands:
  starborne:
    description: Shows information about the Starborne SMP plugin.
    usage: /starborne
    permission: starborne.use


  ritualstart:
    description: Starts an administrator test Legendary ritual.
    usage: /ritualstart
    permission: starborne.ritual.admin


  souls:
    description: Check a player's Soul Tier and Soul Power value.
    usage: /souls [player]
    permission: starborne.ability


  pvptier:
    description: View or set a player's PvP tier.
    usage: /pvptier <player> [tier]
    permission: starborne.admin


  soulpower:
    description: Check the Soul Power of your held Legendary or Mythic.
    usage: /soulpower
    permission: starborne.ability


  setability:
    description: Assigns a registered ability to the held item.
    usage: /setability <ability_id>
    permission: starborne.admin


  abilities:
    description: Shows your equipped abilities and cooldowns.
    usage: /abilities
    permission: starborne.ability


  ability1:
    description: Activates your helmet ability.
    usage: /ability1
    permission: starborne.ability

  ability2:
    description: Activates your chestplate ability.
    usage: /ability2
    permission: starborne.ability

  ability3:
    description: Activates your leggings ability.
    usage: /ability3
    permission: starborne.ability

  ability4:
    description: Activates your boots ability.
    usage: /ability4
    permission: starborne.ability

  ability5:
    description: Activates your main-hand ability.
    usage: /ability5
    permission: starborne.ability

    
  trust:
    description: Trust or untrust another player.
    usage: /trust <player>
    permission: starborne.ability


permissions:
  starborne.use:
    description: Allows the player to use /starborne.
    default: true

    
  starborne.admin:
    description: Allows access to Starborne developer commands.
    default: op

  starborne.ritual.admin:
    description: Allows administrators to start test Legendary rituals.
    default: op


  starborne.ability:
    description: Allows the player to use Starborne abilities.
    default: true
